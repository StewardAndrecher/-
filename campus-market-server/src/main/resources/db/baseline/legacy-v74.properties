table.purchase_intent_message_reads=CREATE TABLE `purchase_intent_message_reads` (\n  `intent_id` bigint NOT NULL,\n  `user_id` bigint NOT NULL,\n  `last_read_message_id` bigint NOT NULL,\n  `updated_at` datetime(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),\n  PRIMARY KEY (`intent_id`,`user_id`),\n  KEY `fk_intent_read_user` (`user_id`),\n  KEY `fk_intent_read_message` (`last_read_message_id`),\n  CONSTRAINT `fk_intent_read_intent` FOREIGN KEY (`intent_id`) REFERENCES `purchase_intents` (`id`),\n  CONSTRAINT `fk_intent_read_message` FOREIGN KEY (`last_read_message_id`) REFERENCES `purchase_intent_messages` (`id`),\n  CONSTRAINT `fk_intent_read_user` FOREIGN KEY (`user_id`) REFERENCES `users` (`id`),\n  CONSTRAINT `chk_intent_read_message` CHECK ((`last_read_message_id` > 0))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
table.purchase_intent_messages=CREATE TABLE `purchase_intent_messages` (\n  `id` bigint NOT NULL AUTO_INCREMENT,\n  `intent_id` bigint NOT NULL,\n  `sender_id` bigint NOT NULL,\n  `request_id` char(36) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,\n  `content` varchar(500) NOT NULL,\n  `created_at` datetime(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),\n  `is_withdrawn` tinyint(1) NOT NULL DEFAULT '0',\n  `withdrawn_at` datetime(6) DEFAULT NULL,\n  PRIMARY KEY (`id`),\n  UNIQUE KEY `uq_intent_message_request` (`intent_id`,`sender_id`,`request_id`),\n  KEY `fk_intent_message_sender` (`sender_id`),\n  KEY `idx_intent_message_created` (`intent_id`,`created_at`,`id`),\n  CONSTRAINT `fk_intent_message_intent` FOREIGN KEY (`intent_id`) REFERENCES `purchase_intents` (`id`),\n  CONSTRAINT `fk_intent_message_sender` FOREIGN KEY (`sender_id`) REFERENCES `users` (`id`),\n  CONSTRAINT `chk_intent_message_content` CHECK ((char_length(trim(`content`)) between 1 and 500)),\n  CONSTRAINT `chk_intent_message_withdrawal` CHECK ((((`is_withdrawn` = false) and (`withdrawn_at` is null)) or ((`is_withdrawn` = true) and (`withdrawn_at` is not null))))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
table.purchase_intents=CREATE TABLE `purchase_intents` (\n  `id` bigint NOT NULL AUTO_INCREMENT,\n  `product_id` bigint NOT NULL,\n  `buyer_id` bigint NOT NULL,\n  `seller_id` bigint NOT NULL,\n  `product_title_snapshot` varchar(50) NOT NULL,\n  `price_in_cents_snapshot` bigint NOT NULL,\n  `product_version_snapshot` bigint NOT NULL,\n  `status` varchar(16) NOT NULL DEFAULT 'PENDING',\n  `created_at` datetime(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),\n  `cancelled_at` datetime(6) DEFAULT NULL,\n  `accepted_at` datetime(6) DEFAULT NULL,\n  PRIMARY KEY (`id`),\n  UNIQUE KEY `uq_purchase_intent_buyer_product` (`product_id`,`buyer_id`),\n  KEY `idx_intent_buyer_created` (`buyer_id`,`created_at` DESC,`id` DESC),\n  KEY `idx_intent_seller_created` (`seller_id`,`created_at` DESC,`id` DESC),\n  CONSTRAINT `fk_intent_buyer` FOREIGN KEY (`buyer_id`) REFERENCES `users` (`id`),\n  CONSTRAINT `fk_intent_product` FOREIGN KEY (`product_id`) REFERENCES `products` (`id`),\n  CONSTRAINT `fk_intent_seller` FOREIGN KEY (`seller_id`) REFERENCES `users` (`id`),\n  CONSTRAINT `chk_intent_participants` CHECK ((`buyer_id` <> `seller_id`)),\n  CONSTRAINT `chk_intent_price` CHECK ((`price_in_cents_snapshot` between 1 and 99999999)),\n  CONSTRAINT `chk_intent_status` CHECK ((`status` in (_utf8mb4'PENDING',_utf8mb4'CANCELLED',_utf8mb4'ACCEPTED'))),\n  CONSTRAINT `chk_intent_timestamps` CHECK ((((`status` = _utf8mb4'PENDING') and (`cancelled_at` is null) and (`accepted_at` is null)) or ((`status` = _utf8mb4'CANCELLED') and (`cancelled_at` is not null) and (`accepted_at` is null)) or ((`status` = _utf8mb4'ACCEPTED') and (`cancelled_at` is null) and (`accepted_at` is not null)))),\n  CONSTRAINT `chk_intent_version` CHECK ((`product_version_snapshot` between 0 and 9007199254740991))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
table.users=CREATE TABLE `users` (\n  `id` bigint NOT NULL AUTO_INCREMENT,\n  `username` varchar(32) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,\n  `password_hash` varchar(255) CHARACTER SET ascii COLLATE ascii_bin NOT NULL,\n  `nickname` varchar(30) NOT NULL,\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (`id`),\n  UNIQUE KEY `uk_users_username` (`username`),\n  CONSTRAINT `chk_users_username` CHECK (regexp_like(`username`,_utf8mb4'^[a-z0-9_]{4,32}$',_utf8mb4'c'))\n) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
