spring.application.name=campus-market-server

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campus_market
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
market.upload-dir=${UPLOAD_DIR:./data/uploads}
server.tomcat.max-swallow-size=6MB

# 第30课：只开放只读健康检查；数据库故障不影响存活探针。
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/api
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1

# 第67课：Redis只缓存公开商品正文，数据库仍决定可见性、版本和动态资料。
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=200ms
spring.data.redis.repositories.enabled=false
market.product-cache.enabled=${PRODUCT_CACHE_ENABLED:true}
market.product-cache.prefix=${PRODUCT_CACHE_PREFIX:campus:product-detail:v1:}
market.product-cache.ttl-seconds=${PRODUCT_CACHE_TTL_SECONDS:60}
# Redis是可降级缓存，不参与存活/就绪判定；MySQL仍参与就绪判定。
management.health.redis.enabled=false

# 第68课：独立的登录保护Redis，不能和可淘汰的商品缓存共用实例。
market.login-protection.enabled=${LOGIN_PROTECTION_ENABLED:true}
market.login-protection.host=${LOGIN_REDIS_HOST:127.0.0.1}
market.login-protection.port=${LOGIN_REDIS_PORT:6380}
market.login-protection.password=${LOGIN_REDIS_PASSWORD:}
market.login-protection.prefix=${LOGIN_PROTECTION_PREFIX:campus:login:v1:}
market.login-protection.account-limit=${LOGIN_ACCOUNT_LIMIT:5}
market.login-protection.account-window-seconds=${LOGIN_ACCOUNT_WINDOW_SECONDS:900}
market.login-protection.ip-limit=${LOGIN_IP_LIMIT:30}
market.login-protection.ip-window-seconds=${LOGIN_IP_WINDOW_SECONDS:60}
# 来源地址只取TCP连接，不信任客户端伪造的代理头；部署反向代理时需另行配置可信代理。
server.forward-headers-strategy=none

# 第70课：教学模拟付款，不调用真实支付渠道；正式部署应关闭模拟接口。
market.orders.simulated-payment-enabled=${ORDER_SIMULATED_PAYMENT_ENABLED:true}
market.orders.timeout-sweep-enabled=${ORDER_TIMEOUT_SWEEP_ENABLED:true}
market.orders.timeout-sweep-delay-ms=${ORDER_TIMEOUT_SWEEP_DELAY_MS:30000}

# 第74课：RabbitMQ仅用于异步超时提醒，订单和Outbox同事务；扫描补偿继续运行。
market.orders.mq.enabled=${ORDER_MQ_ENABLED:false}
market.orders.mq.prefix=${ORDER_MQ_PREFIX:campus.order.v1}
market.orders.mq.delay-ms=900000
market.orders.mq.confirm-timeout-ms=5000
market.orders.mq.dispatch-delay-ms=1000
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:campus_mq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/campus-market}
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.requested-heartbeat=15s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
management.health.rabbit.enabled=false

# 第75课：业务指标仅通过独立凭证采集；原健康检查和Actuator暴露范围不变。
market.monitoring.enabled=${MONITORING_ENABLED:false}
market.monitoring.token=${MONITORING_TOKEN:}
market.monitoring.poll-delay-ms=5000

# 第78课：请求关联编号和轮转日志；指标/探针不产生高频请求摘要。
logging.pattern.level=%5p [requestId:%X{requestId:-none}] [eventId:%X{eventId:-none}]
logging.file.name=${APP_LOG_FILE:./data/logs/campus-market.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# 第80课：默认关闭的本机开发文档，不扫描健康检查或运维采集接口。
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs.html
springdoc.packages-to-scan=com.campus.market
springdoc.paths-to-match=/api/**
springdoc.paths-to-exclude=/api/ops/**,/api/health,/api/health/**
springdoc.use-fqn=true
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.writer-with-order-by-keys=true
