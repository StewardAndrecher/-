spring.application.name=campus-market-server

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campus_market
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
market.upload-dir=${UPLOAD_DIR:./data/uploads}
server.tomcat.max-swallow-size=6MB

# 第30课：只开放只读健康检查；数据库故障不影响存活探针。
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/api
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=-1
